<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img"
     aria-label="Esquema comparando los tres modos de aprobación de Cowork: Manual, Automático y el modo que omite las pausas.">
  <style>
    .s{fill:#ffffff}.t{fill:#1a2332;font:600 14px system-ui,sans-serif}
    .m{fill:#5a6b82;font:12px system-ui,sans-serif}
    .tag{fill:#2563eb;font:600 10px system-ui,sans-serif;letter-spacing:.08em}
    .h{fill:#1a2332;font:600 15px system-ui,sans-serif}
    .pill{font:600 10px system-ui,sans-serif;letter-spacing:.06em}
  </style>
  <rect x="1" y="1" width="638" height="358" rx="10" class="s" stroke="#dce3ec"/>
  <text x="16" y="24" class="tag">ESQUEMA</text>

  <text x="24" y="60" class="h">Cuánto se detiene a preguntarte</text>

  <!-- Manual -->
  <rect x="24" y="82" width="188" height="200" rx="10" fill="#f5f7fa" stroke="#15803d"/>
  <rect x="44" y="102" width="80" height="20" rx="10" fill="#15803d" fill-opacity=".16"/>
  <text x="56" y="116" class="pill" fill="#15803d">EMPIEZA AQUÍ</text>
  <text x="44" y="150" class="t">Manual</text>
  <text x="44" y="176" class="m">Pausa y pide permiso</text>
  <text x="44" y="194" class="m">en cada acción.</text>
  <text x="44" y="224" class="m">Más lento, pero ves</text>
  <text x="44" y="242" class="m">exactamente qué hace</text>
  <text x="44" y="260" class="m">antes de que lo haga.</text>

  <!-- Auto -->
  <rect x="226" y="82" width="188" height="200" rx="10" fill="#f5f7fa" stroke="#dce3ec"/>
  <text x="246" y="150" class="t">Automático</text>
  <text x="246" y="176" class="m">Avanza solo, con</text>
  <text x="246" y="194" class="m">revisión de seguridad.</text>
  <text x="246" y="224" class="m">Solo se detiene en lo</text>
  <text x="246" y="242" class="m">sensible. Consume más</text>
  <text x="246" y="260" class="m">uso por esa revisión.</text>

  <!-- Skip -->
  <rect x="428" y="82" width="188" height="200" rx="10" fill="#f5f7fa" stroke="#b91c1c"/>
  <rect x="448" y="102" width="66" height="20" rx="10" fill="#b91c1c" fill-opacity=".16"/>
  <text x="460" y="116" class="pill" fill="#b91c1c">CUIDADO</text>
  <text x="448" y="150" class="t">Sin pausas</text>
  <text x="448" y="176" class="m">No pregunta y nada</text>
  <text x="448" y="194" class="m">revisa sus acciones</text>
  <text x="448" y="212" class="m">automáticamente.</text>
  <text x="448" y="242" class="m">Solo con carpetas</text>
  <text x="448" y="260" class="m">que puedas perder.</text>

  <text x="24" y="320" class="m">Borrar archivos siempre te pide confirmación explícita, en cualquiera de los tres modos.</text>
</svg>
