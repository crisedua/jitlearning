<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img"
     aria-label="Esquema del panel Personalizar de Claude: la pestaña Skills con varias skills y sus interruptores, y el botón de más que abre el directorio.">
  <style>
    .s{fill:#ffffff}
    .t{fill:#14130f;font:13px system-ui,sans-serif}
    .m{fill:#57544b;font:12px system-ui,sans-serif}
    .k{fill:#2b4e7e;font:600 13px system-ui,sans-serif}
    .tag{fill:#2b4e7e;font:600 10px system-ui,sans-serif;letter-spacing:.08em}
    .bar{fill:#e5e0d4}
    .lbl{fill:#14130f;font:12px system-ui,sans-serif}
  </style>
  <rect x="1" y="1" width="638" height="358" rx="10" class="s" stroke="#e5e0d4"/>
  <text x="16" y="24" class="tag">ESQUEMA</text>

  <!-- sidebar with Personalizar highlighted -->
  <rect x="16" y="38" width="164" height="306" rx="8" fill="#faf8f3" stroke="#e5e0d4"/>
  <rect x="32" y="56" width="88" height="10" rx="5" class="bar"/>
  <rect x="32" y="88" width="112" height="9" rx="4.5" class="bar"/>
  <rect x="32" y="112" width="80" height="9" rx="4.5" class="bar"/>
  <rect x="24" y="138" width="148" height="34" rx="7" fill="#2b4e7e" fill-opacity=".14" stroke="#2b4e7e"/>
  <circle cx="42" cy="155" r="5" fill="#2b4e7e"/>
  <text x="56" y="160" class="k">Personalizar</text>
  <rect x="32" y="190" width="96" height="9" rx="4.5" class="bar"/>

  <!-- main panel -->
  <rect x="196" y="38" width="428" height="306" rx="8" fill="#faf8f3" stroke="#e5e0d4"/>

  <!-- tabs -->
  <text x="218" y="72" class="k">Skills</text>
  <rect x="216" y="80" width="40" height="2" fill="#2b4e7e"/>
  <text x="276" y="72" class="m">Conectores</text>
  <text x="356" y="72" class="m">Plugins</text>

  <!-- "+" opens the directory -->
  <rect x="566" y="54" width="36" height="26" rx="6" fill="#2b4e7e" fill-opacity=".14" stroke="#2b4e7e"/>
  <path d="M584 61v12M578 67h12" stroke="#2b4e7e" stroke-width="2" stroke-linecap="round"/>
  <text x="468" y="102" class="m">El "+" abre el directorio</text>

  <!-- skill rows with toggles -->
  <g>
    <rect x="216" y="116" width="386" height="44" rx="7" class="s" stroke="#e5e0d4"/>
    <rect x="232" y="130" width="16" height="16" rx="3" fill="#e5e0d4"/>
    <text x="260" y="137" class="lbl">Guía de marca</text>
    <text x="260" y="152" class="m" font-size="10.5">Aplica tu identidad a documentos y presentaciones</text>
    <rect x="552" y="130" width="34" height="18" rx="9" fill="#1f6b45"/>
    <circle cx="577" cy="139" r="6.5" fill="#ffffff"/>
  </g>
  <g>
    <rect x="216" y="168" width="386" height="44" rx="7" class="s" stroke="#e5e0d4"/>
    <rect x="232" y="182" width="16" height="16" rx="3" fill="#e5e0d4"/>
    <text x="260" y="189" class="lbl">Informe semanal</text>
    <text x="260" y="204" class="m" font-size="10.5">Tu formato de reporte, con las secciones fijas</text>
    <rect x="552" y="182" width="34" height="18" rx="9" fill="#1f6b45"/>
    <circle cx="577" cy="191" r="6.5" fill="#ffffff"/>
  </g>
  <g>
    <rect x="216" y="220" width="386" height="44" rx="7" class="s" stroke="#e5e0d4"/>
    <rect x="232" y="234" width="16" height="16" rx="3" fill="#e5e0d4"/>
    <text x="260" y="241" class="lbl">Análisis de cohortes</text>
    <text x="260" y="256" class="m" font-size="10.5">Compartida por un colega · apagada hasta que la enciendas</text>
    <rect x="552" y="234" width="34" height="18" rx="9" fill="#e5e0d4"/>
    <circle cx="561" cy="243" r="6.5" fill="#ffffff"/>
  </g>

  <text x="216" y="292" class="m">Claude revisa las que están encendidas y carga sola la que</text>
  <text x="216" y="310" class="m">haga falta. No tienes que invocarla: describe la tarea.</text>
  <text x="216" y="332" class="m" font-size="11">Sin la ejecución de código activada, ninguna funciona.</text>
</svg>
