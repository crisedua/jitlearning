<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img"
     aria-label="Esquema de un proyecto en ChatGPT: la barra lateral, los archivos de referencia y el menú de tres puntos que abre la configuración del proyecto.">
  <style>
    .s{fill:#151b23}.t{fill:#e6edf3;font:13px system-ui,sans-serif}
    .m{fill:#7d8792;font:12px system-ui,sans-serif}
    .k{fill:#5b8cff;font:600 13px system-ui,sans-serif}
    .tag{fill:#5b8cff;font:600 10px system-ui,sans-serif;letter-spacing:.08em}
    .bar{fill:#232c37}
  </style>
  <rect x="1" y="1" width="638" height="358" rx="10" class="s" stroke="#232c37"/>
  <text x="16" y="24" class="tag">ESQUEMA</text>

  <!-- sidebar -->
  <rect x="16" y="38" width="160" height="306" rx="8" fill="#0d1117" stroke="#232c37"/>
  <rect x="32" y="58" width="88" height="9" rx="4.5" class="bar"/>
  <rect x="24" y="84" width="144" height="30" rx="7" fill="#5b8cff" fill-opacity=".14" stroke="#5b8cff"/>
  <text x="40" y="104" class="k">Proyectos</text>
  <rect x="32" y="132" width="112" height="9" rx="4.5" class="bar"/>
  <rect x="32" y="156" width="80" height="9" rx="4.5" class="bar"/>
  <rect x="32" y="180" width="104" height="9" rx="4.5" class="bar"/>

  <!-- main -->
  <rect x="192" y="38" width="432" height="306" rx="8" fill="#0d1117" stroke="#232c37"/>
  <text x="214" y="72" class="t">Lanzamiento Q3</text>

  <!-- three dots -->
  <rect x="566" y="52" width="38" height="28" rx="6" fill="#5b8cff" fill-opacity=".18" stroke="#5b8cff"/>
  <circle cx="577" cy="66" r="2.2" fill="#5b8cff"/>
  <circle cx="585" cy="66" r="2.2" fill="#5b8cff"/>
  <circle cx="593" cy="66" r="2.2" fill="#5b8cff"/>
  <text x="470" y="106" class="m">→ Configuración del proyecto</text>

  <text x="214" y="132" class="m">Archivos de referencia</text>
  <g>
    <rect x="214" y="146" width="126" height="72" rx="8" class="s" stroke="#232c37"/>
    <rect x="230" y="164" width="18" height="12" rx="2" fill="#3d4a5a"/>
    <rect x="230" y="188" width="88" height="8" rx="4" class="bar"/>
  </g>
  <g>
    <rect x="352" y="146" width="126" height="72" rx="8" class="s" stroke="#232c37"/>
    <rect x="368" y="164" width="18" height="12" rx="2" fill="#3d4a5a"/>
    <rect x="368" y="188" width="70" height="8" rx="4" class="bar"/>
  </g>
  <rect x="490" y="146" width="114" height="72" rx="8" fill="#151b23" stroke="#232c37" stroke-dasharray="4 3"/>
  <path d="M547 170v24M535 182h24" stroke="#7d8792" stroke-width="2" stroke-linecap="round"/>

  <rect x="214" y="240" width="390" height="1" class="bar"/>
  <text x="214" y="268" class="m">Chats del proyecto</text>
  <rect x="214" y="284" width="390" height="30" rx="7" class="s" stroke="#232c37"/>
  <rect x="230" y="295" width="150" height="8" rx="4" class="bar"/>

  <text x="214" y="338" class="m">El proyecto recuerda los chats anteriores, no solo los archivos.</text>
</svg>
